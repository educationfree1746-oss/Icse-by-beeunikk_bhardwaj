<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AB ICSE</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f5f5;
    color:#111;
    transition:.2s;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* ================= HEADER ================= */

.header{
    height:65px;
    background:#000;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 14px;
    position:sticky;
    top:0;
    z-index:100;
}

.headerLeft{
    display:flex;
    align-items:center;
    gap:10px;
}

.menuButton{
    background:none;
    color:#fff;
    font-size:28px;
    padding:5px;
}

.logo{
    width:43px;
    height:43px;
    border-radius:50%;
    background:#fff;
    color:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-weight:bold;
    font-size:10px;
    line-height:11px;
}

.headerTitle{
    font-size:20px;
    font-weight:bold;
}

.xpButton{
    background:#fff;
    color:#000;
    padding:9px 12px;
    border-radius:20px;
    font-weight:bold;
}

/* ================= MAIN ================= */

.container{
    max-width:950px;
    margin:auto;
    padding:18px;
    padding-bottom:90px;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

/* ================= GENERAL ================= */

.hero{
    background:linear-gradient(135deg,#000,#444);
    color:#fff;
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
}

.hero h1{
    margin-bottom:8px;
}

.card{
    background:#fff;
    border-radius:17px;
    padding:18px;
    margin:15px 0;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.card h2,
.card h3{
    margin-bottom:8px;
}

.primaryButton{
    background:#000;
    color:#fff;
    padding:12px 16px;
    border-radius:10px;
    font-weight:bold;
    margin-top:8px;
}

.secondaryButton{
    background:#eee;
    color:#111;
    padding:10px 14px;
    border-radius:10px;
    margin-top:8px;
}

/* ================= OFFERINGS ================= */

.offeringGrid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-top:14px;
}

.offering{
    background:#fff;
    padding:18px 8px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
    cursor:pointer;
    transition:.15s;
}

.offering:hover{
    transform:translateY(-2px);
}

.offeringIcon{
    font-size:28px;
    margin-bottom:8px;
}

.offeringTitle{
    font-weight:bold;
    font-size:14px;
}

/* ================= EVENTS ================= */

.event{
    display:flex;
    gap:15px;
    align-items:center;
    padding:15px 0;
    border-bottom:1px solid #eee;
}

.event:last-child{
    border-bottom:0;
}

.eventIcon{
    font-size:28px;
}

.eventTime{
    font-size:12px;
    color:#777;
}

.eventTitle{
    font-weight:bold;
    margin-top:3px;
}

/* ================= STUDY ZONE ================= */

.studyGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.studyItem{
    background:#fff;
    padding:20px 10px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
    cursor:pointer;
}

.studyItem span{
    display:block;
    font-size:28px;
    margin-bottom:8px;
}

/* ================= SUBJECTS ================= */

.subjectGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:15px;
}

.subject{
    background:#fff;
    padding:20px 10px;
    border-radius:15px;
    text-align:center;
    font-weight:bold;
    box-shadow:0 4px 14px rgba(0,0,0,.06);
    cursor:pointer;
}

.subject span{
    display:block;
    font-size:30px;
    margin-bottom:8px;
}

/* ================= MATERIAL ================= */

.material{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:15px 0;
    border-bottom:1px solid #eee;
}

.material:last-child{
    border-bottom:0;
}

.materialButton{
    background:#000;
    color:#fff;
    padding:9px 13px;
    border-radius:9px;
}

/* ================= INPUT ================= */

input,
textarea,
select{
    width:100%;
    border:1px solid #ccc;
    border-radius:10px;
    padding:13px;
    margin:6px 0;
    font-size:15px;
    outline:none;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#000;
}

/* ================= TEST ================= */

.test{
    border:1px solid #eee;
    padding:15px;
    border-radius:12px;
    margin:10px 0;
}

.testButton{
    background:#000;
    color:#fff;
    padding:9px 14px;
    border-radius:8px;
    margin-top:8px;
}

/* ================= COMMUNITY ================= */

.post{
    border-left:4px solid #000;
}

.postName{
    font-weight:bold;
    margin-bottom:7px;
}

.postActions{
    display:flex;
    gap:8px;
    margin-top:12px;
}

    background:#eee;
    padding:7px 12px;
